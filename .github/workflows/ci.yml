name: CI

on:
  push:
  pull_request:

jobs:
  # core は PyPI 未公開なので checkout して先に editable install する。
  # torch は CPU wheel を使う（CI に GPU は無い）。
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          path: jidohub-agents

      - uses: actions/checkout@v4
        with:
          repository: c60evaporator/jidohub-core
          path: jidohub-core

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install jidohub-core (先に editable install)
        # 順序が逆だと pip が PyPI を探しに行って失敗する（CLAUDE.md 1 章）。
        run: python -m pip install -e ./jidohub-core

      - name: Install CPU torch (GPU なし CI 用)
        # torch はここで初めて必須依存になる。GPU が無いので CPU wheel を明示的に先に入れ、
        # agents のインストール時に既定 index の GPU wheel を引かせない。
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install jidohub-agents (dev)
        run: python -m pip install -e './jidohub-agents[dev]'

      - name: Verify core schema version (テスト前に整合を確認)
        # 古い core を掴んだ場合、分かりにくいテスト失敗ではなく明示エラーで落とす。
        run: python -c "from jidohub.core.schemas import SCHEMA_VERSION, Image; print(SCHEMA_VERSION)"

      - name: ruff check
        working-directory: jidohub-agents
        run: ruff check .

      - name: ruff format --check
        working-directory: jidohub-agents
        run: ruff format --check .

      - name: mypy
        working-directory: jidohub-agents
        run: mypy

      - name: pytest
        working-directory: jidohub-agents
        run: pytest
